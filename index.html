<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b3729">
<title>The Only Connection You Need Is With Jesus</title>
<meta property="og:title" content="The only connection you need is with Jesus!">
<meta property="og:image" content="anniversary.jpg?v=3">
<style>
  html, body { margin: 0; height: 100%; background: #2b3729; overflow: hidden; }

  /* Full-screen stage: centers the picture horizontally and vertically on any device */
  .stage {
    position: fixed;
    inset: 0;
    height: 100vh;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background: #2b3729;
  }

  /* Wrapper hugs the picture. Its ::before continues the picture's own colours
     (orange at the top, dark green at the bottom) above, below and beside it,
     so there are no bars and no blur on any screen shape. */
  .frame { position: relative; line-height: 0; }
  .frame::before {
    content: "";
    position: absolute;
    left: -100vw; right: -100vw; top: -100vh; bottom: -100vh;
    background: linear-gradient(to bottom,
      #df6b20 100vh,
      #bd6120 calc(100vh + (100% - 200vh) * .22),
      #915523 calc(100vh + (100% - 200vh) * .37),
      #664824 calc(100vh + (100% - 200vh) * .52),
      #473f28 calc(100vh + (100% - 200vh) * .67),
      #323927 calc(100vh + (100% - 200vh) * .82),
      #2b3729 calc(100% - 100vh));
  }

  /* The picture keeps its proportions and shrinks to fit the screen, never cropped or stretched */
  .pic {
    position: relative;
    display: block;
    width: auto;
    height: auto;
    max-width: calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right));
    max-height: calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    max-height: calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
    object-fit: contain;
  }

  /* ---------- Intro animation: "Connecting..." then reveal ---------- */
  .frame { animation: reveal 1s cubic-bezier(.2,.7,.2,1) 2.1s both; }
  @keyframes reveal { from { opacity: 0; transform: scale(1.05); } to { opacity: 1; transform: scale(1); } }

  .intro {
    position: absolute; inset: 0; z-index: 5;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: #2b3729; color: #fff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    animation: introOut .7s ease 2.1s forwards;
    pointer-events: none;
  }
  @keyframes introOut { to { opacity: 0; visibility: hidden; } }
  .wifi { width: 96px; height: 96px; }
  .wifi path, .wifi circle { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; opacity: .15; animation: bar 1.1s ease-in-out infinite; }
  .wifi circle { fill: #fff; stroke: none; animation-delay: 0s; }
  .wifi .a2 { animation-delay: .18s; } .wifi .a3 { animation-delay: .36s; } .wifi .a4 { animation-delay: .54s; }
  @keyframes bar { 0%, 100% { opacity: .15; } 40%, 70% { opacity: 1; } }
  .label { position: relative; height: 1.4em; width: 14em; text-align: center; font-size: 20px; letter-spacing: .04em; }
  .label span { position: absolute; left: 0; right: 0; }
  .label .t1 { animation: t1 .3s ease 1.45s forwards; }
  .label .t2 { opacity: 0; animation: t2 .3s ease 1.5s forwards; }
  @keyframes t1 { to { opacity: 0; } }
  @keyframes t2 { to { opacity: 1; } }
  .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }

  @media (prefers-reduced-motion: reduce) {
    .intro { display: none; }
    .frame { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="intro" aria-hidden="true">
      <svg class="wifi" viewBox="0 0 100 100">
        <path class="a4" d="M8 38 Q50 -2 92 38"/>
        <path class="a3" d="M23 53 Q50 28 77 53"/>
        <path class="a2" d="M36 67 Q50 55 64 67"/>
        <circle cx="50" cy="82" r="6"/>
      </svg>
      <div class="label"><span class="t1">Connecting<span class="dots"></span></span><span class="t2">Connected &#10003;</span></div>
    </div>
    <div class="frame">
      <img class="pic" src="anniversary.jpg?v=3" alt="The only connection you need is with Jesus! Happy anniversary, church fam!">
    </div>
  </main>
</body>
</html>
